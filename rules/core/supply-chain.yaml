id: remote-fetch-and-execute
type: pattern
severity: critical
confidence: high
owasp: ASI04
frameworks: [all]
description: Skill downloads and executes remote code
match:
  file_contains: "((curl|wget)\\b[^|;&\\n]*\\|\\s*(sudo\\s+)?(ba|z|da|k)?sh\\b|\\b(ba|z|da|k)?sh\\s+(-\\w+\\s+)*[\"']?\\$\\(\\s*(curl|wget)\\b|(\\b(ba|z|da|k)?sh|\\bsource|(^|[\\s;&|])\\.)\\s+<\\(\\s*(curl|wget)\\b|eval\\s*\\(?\\s*[\"'`]?\\$\\(\\s*(curl|wget)\\b)"
metadata:
  author: havik-core
  created: "2026-03-27"

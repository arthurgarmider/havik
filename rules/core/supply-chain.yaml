id: suspicious-obfuscation
type: pattern
severity: high
confidence: medium
owasp: ASI04
frameworks: [all]
description: Skill uses obfuscation techniques commonly seen in malware
match:
  file_contains: "(eval\\(atob|Buffer\\.from.{0,300}base64.{0,300}fetch|fromCharCode.{0,300}apply)"
